<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boo!m Night</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<script>
const W = 480, H = 720;
const LANE_XS = [52, 146, 240, 334, 428];

const GAME_DATA = { levels: [], enemyDefs: {} };

class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }
  preload() {
    this.load.json('manifest', 'LevelData/levels.json');
    this.load.json('enemyDefs', 'LevelData/enemies.json');
  }
  create() {
    const manifest = this.cache.json.get('manifest');
    GAME_DATA.enemyDefs = this.cache.json.get('enemyDefs') || {};
    if (manifest) {
      this.scene.start('LevelPreloadScene', { manifest });
    } else {
      console.error('Failed to load level manifest');
    }
  }
}

class LevelPreloadScene extends Phaser.Scene {
  constructor() { super('LevelPreloadScene'); }
  init(data) { this.manifest = data.manifest; }
  preload() {
    this.manifest.forEach(id => {
      this.load.json(`data_${id}`, `LevelData/${id}/level.json`);
    });
  }
  create() {
    this.manifest.forEach(id => {
      const data = this.cache.json.get(`data_${id}`);
      if (data) GAME_DATA.levels.push({ id, ...data });
    });
    this.scene.start('BgmPreloadScene');
  }
}

class BgmPreloadScene extends Phaser.Scene {
  constructor() { super('BgmPreloadScene'); }
  preload() {
    const txt = this.add.text(W/2, H/2, 'Loading Audio...', { fontSize: '18px', color: '#ff8800' }).setOrigin(0.5);
    GAME_DATA.levels.forEach(lvl => {
      if (lvl.config.bgmFile) {
        this.load.audio(`bgm_${lvl.id}`, `LevelData/${lvl.id}/${lvl.config.bgmFile}`);
      }
    });
  }
  create() {
    this.scene.start('TitleScene');
  }
}

// ─── TitleScene ───────────────────────────────────────────────────────────────
class TitleScene extends Phaser.Scene {
  constructor() { super('TitleScene'); }
  create() {
    this.add.rectangle(0, 0, W, H, 0x080010).setOrigin(0);
    for (let i = 0; i < 90; i++)
      this.add.circle(Math.random()*W, Math.random()*H, Math.random()*1.5+0.3, 0xffffff, Math.random()*0.5+0.1);

    // 초승달
    const mg = this.add.graphics();
    mg.fillStyle(0xffeeaa, 0.88); mg.fillCircle(W-75, 85, 50);
    mg.fillStyle(0x080010, 1);    mg.fillCircle(W-52, 72, 50);

    const title = this.add.text(W/2, H/2 - 170, 'Boo!m\nNight', {
      fontSize: '54px', fontFamily: 'system-ui', color: '#ff8800', fontStyle: 'bold',
      align: 'center', stroke: '#220000', strokeThickness: 6,
    }).setOrigin(0.5);

    // 유령 캐릭터
    const g = this.add.graphics();
    g.fillStyle(0xeeeeff, 0.92);
    g.fillCircle(W/2, H/2 - 28, 36);
    g.fillRect(W/2 - 36, H/2 - 28, 72, 36);
    for (let i = 0; i < 3; i++) g.fillCircle(W/2 - 24 + i*24, H/2 + 8, 13);
    g.fillStyle(0x000011);
    g.fillCircle(W/2 - 12, H/2 - 28, 7);
    g.fillCircle(W/2 + 12, H/2 - 28, 7);

    this.add.text(W/2, H/2 + 38, '방향키 : 이동 + 공격 (박자에 맞게!)', {
      fontSize: '14px', fontFamily: 'system-ui', color: '#ffbb88'
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 + 60, '10콤보마다 점수 배율 +0.1x', {
      fontSize: '13px', fontFamily: 'system-ui', color: '#ffaa66'
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 + 82, 'Z : 폭탄 사용', {
      fontSize: '13px', fontFamily: 'system-ui', color: '#ff9966'
    }).setOrigin(0.5);

    const bg = this.add.graphics();
    const drawBtn = c => { bg.clear(); bg.fillStyle(c); bg.fillRoundedRect(W/2-110, H/2+105, 220, 52, 12); };
    drawBtn(0x882200);
    const zone = this.add.zone(W/2, H/2+131, 220, 52).setInteractive();
    this.add.text(W/2, H/2+131, '🎃 시작하기', {
      fontSize: '22px', fontFamily: 'system-ui', color: '#fff', fontStyle: 'bold'
    }).setOrigin(0.5);
    zone.on('pointerover', () => drawBtn(0xcc3300));
    zone.on('pointerout',  () => drawBtn(0x882200));
    zone.on('pointerdown', () => {
      this.cameras.main.fade(300, 0, 0, 0);
      this.time.delayedCall(300, () => this.scene.start('SongSelectScene'));
    });

    this.tweens.add({ targets: title, y: H/2 - 180, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
  }
}

// ─── SongSelectScene ─────────────────────────────────────────────────────────
class SongSelectScene extends Phaser.Scene {
  constructor() { super('SongSelectScene'); }
  create() {
    this.cameras.main.fadeIn(400);

    // 배경
    this.add.rectangle(0, 0, W, H, 0x080010).setOrigin(0);
    for (let i = 0; i < 80; i++)
      this.add.circle(Math.random()*W, Math.random()*H, Math.random()*1.5+0.3, 0xffffff, Math.random()*0.45+0.08);

    // 달
    const mg = this.add.graphics();
    mg.fillStyle(0xffeeaa, 0.88); mg.fillCircle(W-75, 85, 50);
    mg.fillStyle(0x080010, 1);    mg.fillCircle(W-52, 72, 50);

    // 뒤로가기
    const backBg = this.add.graphics();
    backBg.fillStyle(0x330011, 0.8); backBg.fillRoundedRect(10, 10, 70, 28, 8);
    const backZone = this.add.zone(45, 24, 70, 28).setInteractive();
    this.add.text(45, 24, '← 뒤로', { fontSize: '13px', fontFamily: 'system-ui', color: '#ffaa66' }).setOrigin(0.5);
    backZone.on('pointerover',  () => { backBg.clear(); backBg.fillStyle(0x551122, 0.9); backBg.fillRoundedRect(10, 10, 70, 28, 8); });
    backZone.on('pointerout',   () => { backBg.clear(); backBg.fillStyle(0x330011, 0.8); backBg.fillRoundedRect(10, 10, 70, 28, 8); });
    backZone.on('pointerdown',  () => { this.cameras.main.fade(300, 0,0,0); this.time.delayedCall(300, () => this.scene.start('TitleScene')); });

    // 타이틀
    this.add.text(W/2, 58, '🎵 곡 선택', {
      fontSize: '30px', fontFamily: 'system-ui', color: '#ff8800', fontStyle: 'bold',
      stroke: '#220000', strokeThickness: 5,
    }).setOrigin(0.5);

    // 곡 카드
    const cardW = W - 60, cardH = 115;
    GAME_DATA.levels.forEach((lvl, i) => {
      const song = lvl.config;
      const cardX = W / 2, cardY = 175 + i * 140;
      const bg = this.add.graphics();

      const draw = (hover) => {
        bg.clear();
        bg.fillStyle(hover ? 0x3a0022 : 0x1e000f, 1);
        bg.lineStyle(2, hover ? 0xff6600 : 0x882200, 1);
        bg.fillRoundedRect(cardX - cardW/2, cardY - cardH/2, cardW, cardH, 14);
        bg.strokeRoundedRect(cardX - cardW/2, cardY - cardH/2, cardW, cardH, 14);
      };
      draw(false);

      this.add.text(cardX, cardY - 24, song.name, {
        fontSize: '22px', fontFamily: 'system-ui', color: '#ffeeaa', fontStyle: 'bold'
      }).setOrigin(0.5);
      this.add.text(cardX - 70, cardY + 16, `BPM ${song.bpm}`, {
        fontSize: '13px', fontFamily: 'system-ui', color: '#ff8844'
      }).setOrigin(0.5);
      this.add.text(cardX + 70, cardY + 16, song.difficulty, {
        fontSize: '14px', fontFamily: 'system-ui', color: '#ffcc44'
      }).setOrigin(0.5);

      const zone = this.add.zone(cardX, cardY, cardW, cardH).setInteractive();
      zone.on('pointerover',  () => draw(true));
      zone.on('pointerout',   () => draw(false));
      zone.on('pointerdown',  () => {
        this.cameras.main.fade(400, 0,0,0);
        this.time.delayedCall(400, () => this.scene.start('GameScene', { levelId: lvl.id }));
      });
    });
  }
}

// ─── GameScene ────────────────────────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create(data) {
    const levelId = data.levelId || 'Level1';
    const level = GAME_DATA.levels.find(l => l.id === levelId);
    if (!level) {
      console.error('Level not found:', levelId);
      this.scene.start('TitleScene');
      return;
    }

    this.levelData = level;
    this.config    = level.config;
    
    // 전역 적 정의와 레벨별 오버라이드 병합
    this.stats = JSON.parse(JSON.stringify(GAME_DATA.enemyDefs || {}));
    if (level.enemyStats) {
      for (let type in level.enemyStats) {
        this.stats[type] = { ...this.stats[type], ...level.enemyStats[type] };
      }
    }

    this.songKey      = `bgm_${levelId}`;
    this.beatInterval = 60 / (this.config.bpm || 130);
    this.beatOffset   = this.config.offset   || 0.51;
    this.diffScale    = this.config.diffScale || 1.0;

    this.gs = {
      lives: 3, score: 0, bombs: 2,
      fever: false, feverTimer: 0,
      invincible: false,
      bossActive: false, elapsed: 0,
      combo: 0, maxCombo: 0,
      lastMoveOnBeat: false,
    };

    this.lasers       = [];
    this.enemyBullets = [];
    this.enemies      = [];
    this.items        = [];
    this.particles    = [];

    this.laneXs    = LANE_XS;
    this.laneTween = null;
    this.boss      = null;

    this.player = { x: LANE_XS[2], y: H - 100, vy: 0, w: 20, h: 26, lane: 2 };
    this._playerVisible = true;

    // JSON 웨이브 데이터를 큐로 변환 (Beat 기반 -> Time 기반 계산)
    const beatLen = 60 / (this.config.bpm || 130);
    const offset  = this.config.offset || 0;
    this.waveQueue = level.waves.map(w => [
      w.beat * beatLen + offset, 
      w.type, 
      w.lane,
      w.targetLane // <--- 누락되었던 목표 레인 추가
    ]);
    this.waveQueue.sort((a, b) => a[0] - b[0]);
    this.waveIdx   = 0;

    this.bgGfx       = this.add.graphics().setDepth(0);
    this.enemyGfx    = this.add.graphics().setDepth(3);
    this.itemGfx     = this.add.graphics().setDepth(3);
    this.laserGfx    = this.add.graphics().setDepth(4);
    this.bulletGfx   = this.add.graphics().setDepth(4);
    this.playerGfx   = this.add.graphics().setDepth(5);
    this.particleGfx = this.add.graphics().setDepth(6);

    this.buildHUD();
    this.buildOverlays();

    this.cursors = this.input.keyboard.createCursorKeys();
    this.zKey    = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);

    this.cameras.main.fadeIn(500);

    // 배경 음악
    this.bgm = null;
    if (this.cache.audio.exists(this.songKey)) {
      this.sound.stopAll();
      this.bgm = this.sound.add(this.songKey, { loop: true, volume: 0.5 });
      this.bgm.play();
    }
  }



  buildHUD() {
    this.add.rectangle(0, 0, W, 42, 0x000000, 0.72).setOrigin(0).setDepth(10);
    this.scoreDisp = this.add.text(10, 8, '0', {
      fontSize: '16px', fontFamily: 'system-ui', color: '#ffeeaa'
    }).setOrigin(0, 0).setDepth(11);

    // 비트 바 (상단 HUD 중앙)
    this.beatBarGfx = this.add.graphics().setDepth(12);

    this.add.rectangle(0, H-32, W, 32, 0x000000, 0.72).setOrigin(0).setDepth(10);
    this.bombDisp = this.add.text(12, H-16, '💣 x2', {
      fontSize: '14px', fontFamily: 'system-ui', color: '#ffaa44'
    }).setOrigin(0, 0.5).setDepth(11);
    this.feverDisp = this.add.text(W/2, H-16, '', {
      fontSize: '14px', fontFamily: 'system-ui', color: '#ffff55'
    }).setOrigin(0.5).setDepth(11);
    this.comboDisp = this.add.text(W/2, H-16, '', {
      fontSize: '13px', fontFamily: 'system-ui', color: '#ffcc88'
    }).setOrigin(0.5).setDepth(11);
    this.livesDisp = this.add.text(W-10, H-16, '👻 👻 👻', {
      fontSize: '16px', fontFamily: 'system-ui', color: '#ffffff'
    }).setOrigin(1, 0.5).setDepth(11);

    this.bossHpBg   = this.add.rectangle(W/2, H-52, W-40, 10, 0x330000).setDepth(12).setVisible(false);
    this.bossHpFill = this.add.rectangle(20, H-52, W-40, 10, 0xff2222).setOrigin(0, 0.5).setDepth(12).setVisible(false);
    this.bossLabel  = this.add.text(W/2, H-65, 'BOSS', {
      fontSize: '12px', fontFamily: 'system-ui', color: '#ff8888'
    }).setOrigin(0.5).setDepth(12).setVisible(false);
  }

  buildOverlays() {
    this.bossWarning = this.add.text(W/2, H/2-60, '⚠ BOSS ⚠', {
      fontSize: '44px', fontFamily: 'system-ui', color: '#ff4400', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 6,
    }).setOrigin(0.5).setAlpha(0).setDepth(20);

    this.itemMsg = this.add.text(W/2, H/3, '', {
      fontSize: '24px', fontFamily: 'system-ui', color: '#ffff44',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setAlpha(0).setDepth(20);

    this.feverBanner = this.add.text(W/2, H/2-30, '🔥 FEVER! 🔥', {
      fontSize: '40px', fontFamily: 'system-ui', color: '#ffff00', fontStyle: 'bold',
      stroke: '#ff4400', strokeThickness: 5,
    }).setOrigin(0.5).setAlpha(0).setDepth(20);

    this.flashRect = this.add.rectangle(0, 0, W, H, 0xff0000, 0).setOrigin(0).setDepth(25);

    this.beatJudge = this.add.text(W/2, H * 0.52, '', {
      fontSize: '20px', fontFamily: 'system-ui', color: '#ffff44', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setAlpha(0).setDepth(22);
  }

  update(time, delta) {
    if (this.gs.lives <= 0) return;
    const dt = delta / 1000;
    this.gs.elapsed  += dt;

    this.handleInput(dt);
    this.processWaves();
    this.updateBullets(dt);
    this.updateLasers(dt);
    this.updateEnemies(dt);
    this.updateItems(dt);
    this.updateParticles(dt);
    this.updateFever(dt);
    this.checkCollisions();
    this.updateHUD();
    this.renderAll();
  }

  handleInput(dt) {
    const p = this.player;
    const leftJust  = Phaser.Input.Keyboard.JustDown(this.cursors.left);
    const rightJust = Phaser.Input.Keyboard.JustDown(this.cursors.right);
    const upJust    = Phaser.Input.Keyboard.JustDown(this.cursors.up);
    const downJust  = Phaser.Input.Keyboard.JustDown(this.cursors.down);

    let moved = false;
    if (leftJust  && p.lane > 0) { p.lane--; this.moveLane(); moved = true; }
    if (rightJust && p.lane < 4) { p.lane++; this.moveLane(); moved = true; }
    if (upJust || downJust) moved = true;
    if (moved) this.onPlayerMove();

    let tvy = 0;
    if (this.cursors.up.isDown)   tvy = -175;
    if (this.cursors.down.isDown) tvy =  175;
    p.vy += (tvy - p.vy) * 0.18;
    p.y = Phaser.Math.Clamp(p.y + p.vy * dt, p.h + 44, H - p.h - 35);

    if (Phaser.Input.Keyboard.JustDown(this.zKey)) this.useBomb();
  }

  moveLane() {
    if (this.laneTween) this.laneTween.stop();
    this.laneTween = this.tweens.add({
      targets: this.player, x: this.laneXs[this.player.lane],
      duration: 100, ease: 'Cubic.Out',
    });
  }

  onPlayerMove() {
    const p = this.player;
    // 이동 후 위치(새 레인)에서 레이저 발사
    const laserX = this.laneXs[p.lane];
    
    // 가장 가까운 적 찾기 (관통 방지)
    let targetY = 42; // HUD 하단 (기본 목표점)
    let hitEnemy = null;
    let minDiffY = 9999;

    this.enemies.forEach(e => {
      if (!e.alive) return;
      // 같은 레인 판정 (중심 거리 40px 이내)
      if (Math.abs(e.x - laserX) < 40 && e.y < p.y) {
        const diffY = p.y - e.y;
        if (diffY < minDiffY) {
          minDiffY = diffY;
          hitEnemy = e;
        }
      }
    });

    if (hitEnemy) {
      this.damageEnemy(hitEnemy, 1);
      targetY = hitEnemy.y + (hitEnemy.size * 0.5); // 적의 하단부 근처에서 레이저 멈춤
    }

    this.lasers.push({ 
      x: laserX, 
      fromY: p.y - p.h * 0.5, 
      toY: targetY, 
      life: 0.22, 
      maxLife: 0.22 
    });

    // 비트 타이밍 판정 (±150ms 허용)
    const tolerance = 0.15;
    const bElapsed = Math.max(0, this.gs.elapsed - this.beatOffset);
    const phase = bElapsed % this.beatInterval;
    const onBeat = phase <= tolerance || phase >= (this.beatInterval - tolerance);

    if (onBeat) {
      this.gs.combo++;
      if (this.gs.combo > this.gs.maxCombo) this.gs.maxCombo = this.gs.combo;
      this.gs.lastMoveOnBeat = true;
      this.showBeatJudge(true);
    } else {
      this.gs.combo = 0;
      this.gs.lastMoveOnBeat = false;
      this.showBeatJudge(false);
    }
  }

  damageEnemy(e, dmg) {
    if (!e.alive) return;
    e.hp -= dmg;
    this.spawnHitParticles(e.x, e.y);
    if (e.hp > 0) return;
    e.alive = false;
    if (e.type === 'boss') {
      this.gs.bossActive = false;
      this.boss = null;
      this.spawnExplosion(e.x, e.y, 0xff6600, 32);
      this.cameras.main.shake(650, 0.025);
      this.bossHpBg.setVisible(false);
      this.bossHpFill.setVisible(false);
      this.bossLabel.setVisible(false);
      const bossMult = 1 + Math.floor(this.gs.combo / 10) * 0.1;
      this.gs.score += Math.round((this.gs.fever ? 2000 : 1000) * bossMult);
      this.doStageClear();
    } else {
      const pts = { bat: 100, gbat: 200, skeleton: 300, pskeleton: 400 };
      const base = pts[e.type] || 100;
      const mult = 1 + Math.floor(this.gs.combo / 10) * 0.1;
      this.gs.score += Math.round((this.gs.fever ? base * 2 : base) * mult);
      this.spawnExplosion(e.x, e.y, 0xff8800, 8);
      this.maybeDropItem(e.x, e.y);
    }
  }

  updateLasers(dt) {
    this.lasers.forEach(l => l.life -= dt);
    this.lasers = this.lasers.filter(l => l.life > 0);
  }

  showBeatJudge(hit) {
    const combo = this.gs.combo;
    if (hit) {
      const mult = (1 + Math.floor(combo / 10) * 0.1).toFixed(1);
      const txt = combo >= 10 ? `${combo} COMBO  x${mult}` : (combo > 0 ? `${combo} COMBO` : 'PERFECT');
      this.beatJudge.setText(txt).setColor('#ffff44').setAlpha(1).setY(H * 0.52);
    } else {
      this.beatJudge.setText('MISS').setColor('#ff4444').setAlpha(1).setY(H * 0.52);
    }
    this.tweens.killTweensOf(this.beatJudge);
    this.tweens.add({ targets: this.beatJudge, alpha: 0, y: H * 0.44, duration: 550 });
  }

  processWaves() {
    const t = this.gs.elapsed;
    while (this.waveIdx < this.waveQueue.length && this.waveQueue[this.waveIdx][0] <= t) {
      const [, type, lane, targetLane] = this.waveQueue[this.waveIdx++];
      const l = lane < 0 ? ~~(Math.random()*5) : lane;
      if (type === 'boss') this.spawnBoss();
      else if (type === 'item_bomb')  this.spawnMapItem('bomb',  l);
      else if (type === 'item_fever') this.spawnMapItem('fever', l);
      else this.spawnEnemy(type, l, targetLane);
    }
  }

  spawnMapItem(type, lane) {
    // 맵 상단에서 직접 내려오는 아이템 (적 드롭보다 크고 느림)
    this.items.push({ x: this.laneXs[lane], y: -20, vy: 50, type, size: 15, alive: true });
  }

  spawnEnemy(type, lane, targetLane) {
    const x = this.laneXs[lane];
    const bElapsed = Math.max(0, this.gs.elapsed - this.beatOffset);
    const phase    = bElapsed % this.beatInterval;
    const toNext   = this.beatInterval - phase;
    const ds       = this.diffScale;
    const s        = this.stats[type] || { speed: 100, hp: 1 };

    if (type === 'bat') {
      this.enemies.push({ x, y: -20, vy: s.speed * ds, type, lane,
        hp: s.hp, maxHp: s.hp, alive: true, size: 14, shootTimer: 0 });
    } else if (type === 'gbat') {
      const btm = s.beatTimerMultiplier || 2;
      this.enemies.push({ x, y: -25, vy: s.speed * ds, type, lane,
        hp: s.hp, maxHp: s.hp, alive: true, size: 21, shootTimer: 0,
        beatTimer: toNext, spawnLane: lane, targetLane: targetLane ?? lane, 
        pingPong: false, btm });
    } else if (type === 'skeleton' || type === 'pskeleton') {
      const isPoss = type === 'pskeleton';
      const btm = s.beatTimerMultiplier || 2;
      this.enemies.push({ x, y: -28, vy: s.speed * ds, type, lane,
        hp: s.hp, maxHp: s.hp, alive: true, size: 18, shootTimer: 0,
        settled: false, settleY: 100, exitTimer: 0,
        spawnLane: lane, targetLane: targetLane ?? lane, pingPong: false,
        beatTimer: toNext * btm, beatCount: 0, ds, laneDir: isPoss ? 1 : 0, btm });
    }
  }

  spawnBoss() {
    if (this.gs.bossActive) return;
    this.gs.bossActive = true;
    const hp = 80;
    this.boss = {
      x: W/2, y: -70, vy: 65, lane: 2,
      hp, maxHp: hp, type: 'boss',
      alive: true, size: 48,
      settled: false, settleY: 118,
      pattern: 0, phaseTimer: 0, patternTimer: 0,
      moveDir: 1, charging: false, chargeFired: false, chargeTimer: 0,
      prisonTimer: 0, prisonPause: 0,
    };
    this.enemies.push(this.boss);
    this.bossWarning.setAlpha(1).setScale(1);
    this.tweens.killTweensOf(this.bossWarning);
    this.tweens.add({ targets: this.bossWarning, alpha: 0, scaleX: 2.2, scaleY: 2.2, duration: 2000, ease: 'Power2' });
    this.cameras.main.shake(700, 0.018);
    this.bossHpBg.setVisible(true);
    this.bossHpFill.setVisible(true);
    this.bossLabel.setVisible(true);
  }

  updateBullets(dt) {
    this.enemyBullets.forEach(b => {
      if (!b.alive) return;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H+12 || b.x < -12 || b.x > W+12 || b.y < -12) b.alive = false;
    });
    this.enemyBullets = this.enemyBullets.filter(b => b.alive);
  }

  updateEnemies(dt) {
    this.enemies.forEach(e => {
      if (!e.alive) return;
      e.shootTimer += dt;

      if (e.type === 'bat') {
        // 돌진형: 직선 낙하
        e.y += e.vy * dt;
        if (e.y > H + 30) e.alive = false;

      } else if (e.type === 'gbat') {
        // 강화 돌진형: 지정된 두 레인 사이를 박자마다 번갈아 이동
        const s = this.stats[e.type] || {};
        e.y += e.vy * dt;
        e.beatTimer -= dt;
        if (e.beatTimer <= 0) {
          e.beatTimer += this.beatInterval * (s.beatTimerMultiplier || 2);
          e.pingPong = !e.pingPong;
          e.lane = e.pingPong ? e.targetLane : e.spawnLane;
          this.tweens.add({ targets: e, x: this.laneXs[e.lane], duration: 120, ease: 'Cubic.Out' });
        }
        if (e.y > H + 30) e.alive = false;

      } else if (e.type === 'skeleton') {
        const s = this.stats[e.type] || {};
        if (!e.settled) {
          e.y += e.vy * dt;
          if (e.y >= e.settleY) {
            e.y = e.settleY;
            e.settled = true;
            const bElapsed = Math.max(0, this.gs.elapsed - this.beatOffset);
            const syncUnit = this.beatInterval / 2;
            const phase    = bElapsed % syncUnit;
            const toNext   = syncUnit - phase;
            e.beatTimer    = toNext; 
          }
        } else if (e.exiting) {
          // [퇴장 모드] 위로 이동만 수행, 사격 중지
          e.y -= 90 * dt;
          if (e.y < -40) e.alive = false;
        } else {
          // [대기/공격 모드]
          e.exitTimer += dt;
          e.beatTimer -= dt;
          if (e.beatTimer <= 0) {
            e.beatTimer += this.beatInterval * (s.beatTimerMultiplier || 2);
            e.beatCount++;
            this.enemyBullets.push({ x: e.x, y: e.y + e.size,
              vx: 0, vy: (s.bulletSpeed || 205) * (e.ds||1), dmg: 1, alive: true });
            
            // 박자 단위 머무는 시간이 지났다면, 이번 사격을 끝으로 퇴장 모드 전환
            const staySecs = (s.stayDuration || 8) * this.beatInterval;
            if (e.exitTimer >= staySecs) {
              e.exiting = true;
            }
          }
        }

      } else if (e.type === 'pskeleton') {
        const s = this.stats[e.type] || {};
        if (!e.settled) {
          e.y += e.vy * dt;
          if (e.y >= e.settleY) {
            e.y = e.settleY;
            e.settled = true;
            const bElapsed = Math.max(0, this.gs.elapsed - this.beatOffset);
            const syncUnit = this.beatInterval / 2;
            const phase    = bElapsed % syncUnit;
            const toNext   = syncUnit - phase;
            e.beatTimer    = toNext;
          }
        } else if (e.exiting) {
          e.y -= 90 * dt;
          if (e.y < -40) e.alive = false;
        } else {
          e.exitTimer += dt;
          e.beatTimer -= dt;
          if (e.beatTimer <= 0) {
            e.beatTimer += this.beatInterval * (s.beatTimerMultiplier || 2);
            e.beatCount++;
            this.enemyBullets.push({ x: e.x, y: e.y + e.size,
              vx: 0, vy: (s.bulletSpeed || 200) * (e.ds||1), dmg: 1, alive: true });

            // 지정된 두 레인 사이를 번갈아 이동
            e.pingPong = !e.pingPong;
            e.lane = e.pingPong ? e.targetLane : e.spawnLane;
            this.tweens.add({ targets: e, x: this.laneXs[e.lane], duration: 170, ease: 'Cubic.Out' });

            const staySecs = (s.stayDuration || 8) * this.beatInterval;
            if (e.exitTimer >= staySecs) {
              e.exiting = true;
            }
          }
        }

      } else if (e.type === 'boss') {
        if (!e.settled) {
          e.y += e.vy * dt;
          if (e.y >= e.settleY) { e.y = e.settleY; e.settled = true; }
          return;
        }

        e.phaseTimer   += dt;
        e.patternTimer += dt;

        // 6초마다 패턴 전환
        if (e.phaseTimer >= 6) {
          e.phaseTimer = 0;
          e.pattern = (e.pattern + 1) % 3;
          e.patternTimer = 0;
          e.charging = false;
          e.chargeFired = false;
        }

        if (e.pattern === 0) {
          // 가로 패턴: 랜덤 레인 이동 후 2레인 → 0.35s 후 2레인 시간차 발사
          if (e.patternTimer >= 2.4) {
            e.patternTimer = 0;
            const tl = ~~(Math.random() * 5);
            this.tweens.add({
              targets: e, x: this.laneXs[tl], duration: 280, ease: 'Cubic.Out',
              onComplete: () => {
                const lanes = [0,1,2,3,4].filter(l => l !== tl);
                lanes.splice(~~(Math.random()*lanes.length), 1); // 빈 레인 1개
                const first = lanes.slice(0, 2);
                const second = lanes.slice(2);
                const bvy = 190 * this.diffScale;
                first.forEach(l => this.enemyBullets.push({
                  x: this.laneXs[l], y: e.y + 40, vx: 0, vy: bvy, dmg: 1, alive: true,
                }));
                this.time.delayedCall(350, () => {
                  if (!e.alive) return;
                  second.forEach(l => this.enemyBullets.push({
                    x: this.laneXs[l], y: e.y + 40, vx: 0, vy: bvy, dmg: 1, alive: true,
                  }));
                });
              },
            });
          }

        } else if (e.pattern === 1) {
          // 돌진 패턴: 랜덤 레인으로 이동 후 아래로 돌진 + 좌우 탄
          if (!e.charging && e.patternTimer >= 2.2) {
            e.patternTimer = 0;
            const tl = ~~(Math.random() * 5);
            this.tweens.add({
              targets: e, x: this.laneXs[tl], y: e.settleY - 35, duration: 380, ease: 'Cubic.Out',
              onComplete: () => { e.charging = true; e.chargeFired = false; e.chargeTimer = 0; },
            });
          }
          if (e.charging) {
            e.chargeTimer += dt;
            e.y += 420 * dt;
            if (!e.chargeFired) {
              e.chargeFired = true;
              // 좌우 3발씩
              for (let d = -1; d <= 1; d += 2) {
                for (let i = 1; i <= 3; i++) {
                  this.enemyBullets.push({ x: e.x + d*i*30, y: e.y,
                    vx: 0, vy: 178 * this.diffScale, dmg: 1, alive: true });
                }
              }
            }
            if (e.y > H * 0.72 || e.chargeTimer > 0.85) {
              e.charging = false; e.chargeFired = false;
              e.y = e.settleY;
            }
          }

        } else if (e.pattern === 2) {
          // 감옥 패턴: 왼→오 이동, 진행 반대쪽 레인 1개 비우고 4개 발사
          e.prisonTimer += dt;
          if (e.prisonPause > 0) e.prisonPause -= dt;
          e.x += e.moveDir * 80 * dt;
          if (e.x > W - 55) {
            e.x = W - 55; e.moveDir = -1;
            // 방향 전환 후 발사 휴지 (플레이어가 피할 시간 확보)
            e.prisonPause = 0.9; e.prisonTimer = 0;
          }
          if (e.x < 55) {
            e.x = 55; e.moveDir = 1;
            e.prisonPause = 0.9; e.prisonTimer = 0;
          }
          if (e.prisonPause <= 0 && e.prisonTimer >= 0.85) {
            e.prisonTimer = 0;
            const startL = e.moveDir > 0 ? 0 : 1;
            // 2발 먼저, 0.35s 후 나머지 2발
            const pvy = 165 * this.diffScale;
            for (let l = startL; l < startL + 2; l++) {
              this.enemyBullets.push({ x: this.laneXs[l], y: e.y + 45,
                vx: 0, vy: pvy, dmg: 1, alive: true });
            }
            this.time.delayedCall(350, () => {
              if (!e.alive) return;
              for (let l = startL + 2; l < startL + 4; l++) {
                this.enemyBullets.push({ x: this.laneXs[l], y: e.y + 45,
                  vx: 0, vy: pvy, dmg: 1, alive: true });
              }
            });
          }
        }

        const frac = Math.max(0, e.hp / e.maxHp);
        this.bossHpFill.setDisplaySize((W-40)*frac, 10);
      }
    });
    this.enemies = this.enemies.filter(e => e.alive);
  }

  checkCollisions() {
    const p = this.player;

    if (this.gs.invincible) return;

    // 적 탄 → 플레이어
    this.enemyBullets.forEach(b => {
      if (!b.alive) return;
      const dx = b.x - p.x, dy = b.y - p.y;
      if (dx*dx + dy*dy < (p.w+4)*(p.w+4)) { b.alive = false; this.hitPlayer(); }
    });

    // 적 접촉 → 플레이어
    this.enemies.forEach(e => {
      if (!e.alive || e.type === 'boss' || e.type === 'skeleton' || e.type === 'pskeleton') return;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx*dx + dy*dy < (e.size + p.w*0.7)*(e.size + p.w*0.7)) { e.alive = false; this.hitPlayer(); }
    });

    // 아이템 → 플레이어
    this.items = this.items.filter(item => {
      const dx = item.x - p.x, dy = item.y - p.y;
      if (dx*dx + dy*dy < (item.size + p.w)*(item.size + p.w)) { this.applyItem(item.type); return false; }
      return item.alive !== false;
    });
  }

  hitPlayer() {
    if (this.gs.invincible) return;
    this.gs.lives--;
    this.gs.invincible = true;
    this.flashRect.setAlpha(0.6);
    this.tweens.add({ targets: this.flashRect, alpha: 0, duration: 360 });
    this.cameras.main.shake(200, 0.012);
    if (this.gs.lives <= 0) { this.endGame(); return; }
    let blinks = 0;
    const t = this.time.addEvent({ delay: 130, loop: true, callback: () => {
      blinks++;
      this._playerVisible = blinks % 2 !== 0;
      if (blinks >= 14) { t.remove(); this.gs.invincible = false; this._playerVisible = true; }
    }});
  }

  useBomb() {
    if (this.gs.bombs <= 0) return;
    this.gs.bombs--;
    this.enemies.forEach(e => {
      if (e.type !== 'boss') { this.spawnExplosion(e.x, e.y, 0xffcc00, 9); e.alive = false; }
    });
    this.enemyBullets.forEach(b => b.alive = false);
    this.cameras.main.shake(320, 0.015);
    this.cameras.main.flash(200, 255, 200, 0, false);
  }

  maybeDropItem(x, y) {
    const r = Math.random();
    if      (r < 0.08) this.items.push({ x, y, vy: 82, type: 'bomb',  size: 12, alive: true });
    else if (r < 0.14) this.items.push({ x, y, vy: 82, type: 'fever', size: 12, alive: true });
  }

  applyItem(type) {
    if (type === 'bomb') {
      this.gs.bombs = Math.min(this.gs.bombs + 1, 5);
      this.showMsg('💣 폭탄 +1');
    } else if (type === 'fever') {
      this.gs.fever = true;
      this.gs.feverTimer = 30;
      this.feverBanner.setAlpha(1).setScale(1);
      this.tweens.killTweensOf(this.feverBanner);
      this.tweens.add({ targets: this.feverBanner, alpha: 0, scaleX: 1.5, scaleY: 1.5, duration: 1400, ease: 'Power2' });
      this.showMsg('🔥 FEVER! 점수 2배!');
    }
  }

  showMsg(txt) {
    this.itemMsg.setText(txt).setY(H/2 - 20).setAlpha(1).setScale(1);
    this.tweens.killTweensOf(this.itemMsg);
    this.tweens.add({ targets: this.itemMsg, alpha: 0, y: H/2 - 80, scaleX: 1.4, scaleY: 1.4, duration: 1100 });
  }

  updateFever(dt) {
    if (!this.gs.fever) return;
    this.gs.feverTimer -= dt;
    if (this.gs.feverTimer <= 0) { this.gs.fever = false; this.gs.feverTimer = 0; }
  }

  updateItems(dt) {
    this.items.forEach(i => { i.y += i.vy * dt; if (i.y > H+20) i.alive = false; });
    this.items = this.items.filter(i => i.alive !== false);
  }

  spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random()*Math.PI*2, spd = 60+Math.random()*160;
      const life = 0.3+Math.random()*0.5;
      this.particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
        life, maxLife: life, color, size: 2+Math.random()*4 });
    }
  }

  spawnHitParticles(x, y) {
    for (let i = 0; i < 4; i++) {
      const ang = Math.random()*Math.PI*2;
      this.particles.push({ x, y, vx: Math.cos(ang)*100, vy: Math.sin(ang)*100,
        life: 0.22, maxLife: 0.22, color: 0xffffff, size: 2.5 });
    }
  }

  updateParticles(dt) {
    this.particles.forEach(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt; });
    this.particles = this.particles.filter(p => p.life > 0);
  }

  updateHUD() {
    const gs = this.gs;
    this.livesDisp.setText(Array(gs.lives).fill('👻').join(' ') || '');
    this.scoreDisp.setText(gs.score.toLocaleString());
    this.bombDisp.setText(`💣 x${gs.bombs}`);
    this.feverDisp.setText(gs.fever ? `🔥 FEVER ${~~gs.feverTimer}s` : '');
    if (gs.combo >= 10) {
      const mult = (1 + Math.floor(gs.combo / 10) * 0.1).toFixed(1);
      this.comboDisp.setText(`${gs.combo} COMBO  x${mult}`);
    } else if (gs.combo > 0) {
      this.comboDisp.setText(`${gs.combo} COMBO`);
    } else {
      this.comboDisp.setText('');
    }
  }

  doStageClear() {
    if (this.bgm) this.bgm.stop();
    this.add.text(W/2, H/2 - 20, 'STAGE CLEAR!', {
      fontSize: '48px', fontFamily: 'system-ui', color: '#ffff44', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 6,
    }).setOrigin(0.5).setDepth(30);
    this.time.delayedCall(2200, () => {
      this.cameras.main.fade(600, 0, 0, 0);
      this.time.delayedCall(600, () => this.scene.start('ClearScene', { score: this.gs.score }));
    });
  }

  endGame() {
    this.gs.lives = 0;
    if (this.bgm) this.bgm.stop();
    this.cameras.main.fade(500, 0, 0, 0);
    this.time.delayedCall(500, () => this.scene.start('GameOverScene', { score: this.gs.score }));
  }

  renderAll() {
    const p = this.player;

    // 비트 펄스 계산 (BPM 130)
    const bElapsed  = Math.max(0, this.gs.elapsed - this.beatOffset);
    const beatPhase = (bElapsed % this.beatInterval) / this.beatInterval;
    const barPhase  = (bElapsed % (this.beatInterval * 4)) / (this.beatInterval * 4);
    const beatPulse = Math.max(0, 1 - beatPhase * 5);   // 비트마다 짧은 플래시
    const barPulse  = Math.max(0, 1 - barPhase  * 8);   // 마디마다 강한 플래시

    // 비트 바 UI — 진자 방식 (중앙 통과 = 박자)
    this.beatBarGfx.clear();
    {
      const bEl    = Math.max(0, this.gs.elapsed - this.beatOffset);
      const angle  = (bEl * Math.PI) / this.beatInterval; // 비트마다 sin=0 (중앙)
      const sinPos = Math.sin(angle);
      const HALF   = 190;   // 커서 이동 범위 ±px
      const cy     = 22;
      const cx     = W / 2;
      const onBeat = this.gs.lastMoveOnBeat;
      // 커서 색: 콤보 성공 = 초록, 그 외 = 주황
      const cursorMain = onBeat ? 0x00ee44 : 0xff8800;
      const cursorGlow = onBeat ? 0x00ff88 : 0xff6600;

      // 트랙 배경 (더 크고 밝게)
      this.beatBarGfx.fillStyle(0x2a0022, 0.95);
      this.beatBarGfx.fillRoundedRect(cx - HALF - 12, cy - 13, (HALF + 12) * 2, 26, 8);
      // 테두리
      this.beatBarGfx.lineStyle(1.5, 0x882244, 0.8);
      this.beatBarGfx.strokeRoundedRect(cx - HALF - 12, cy - 13, (HALF + 12) * 2, 26, 8);

      // 좌우 끝 마커 (반환점)
      for (const ex of [cx - HALF, cx + HALF]) {
        this.beatBarGfx.fillStyle(0xaa4466, 0.9);
        this.beatBarGfx.fillRect(ex - 2, cy - 10, 4, 20);
      }

      // 중앙 히트존 (더 넓고 밝게)
      const nearCenter = Math.abs(sinPos) < 0.45;
      this.beatBarGfx.fillStyle(nearCenter ? 0xff5500 : 0x661133, nearCenter ? 0.9 : 0.6);
      this.beatBarGfx.fillRect(cx - 5, cy - 14, 10, 28);
      if (nearCenter) {
        this.beatBarGfx.fillStyle(0xff9900, (0.45 - Math.abs(sinPos)) * 1.0);
        this.beatBarGfx.fillRect(cx - 14, cy - 15, 28, 30);
      }

      // 움직이는 커서 (글로우 + 본체 + 하이라이트)
      const cursorX = cx + sinPos * HALF;
      this.beatBarGfx.fillStyle(cursorGlow, 0.35);
      this.beatBarGfx.fillCircle(cursorX, cy, 15);
      this.beatBarGfx.fillStyle(cursorGlow, 0.18);
      this.beatBarGfx.fillCircle(cursorX, cy, 20);
      this.beatBarGfx.fillStyle(cursorMain, 1);
      this.beatBarGfx.fillCircle(cursorX, cy, 8);
      this.beatBarGfx.fillStyle(0xffffff, 0.9);
      this.beatBarGfx.fillCircle(cursorX - 2.5, cy - 2.5, 3);
    }

    // 배경
    this.bgGfx.clear();
    this.bgGfx.fillStyle(0x080010);
    this.bgGfx.fillRect(0, 0, W, H);

    // 달 (비트에 맞춰 미세하게 빛남)
    this.bgGfx.fillStyle(0xffeeaa, 0.15 + barPulse * 0.08);
    this.bgGfx.fillCircle(W - 68, 88, 52);

    // 비트 배경 플래시
    if (beatPulse > 0.01) {
      this.bgGfx.fillStyle(0x4400aa, beatPulse * 0.06);
      this.bgGfx.fillRect(0, 0, W, H);
    }
    if (barPulse > 0.01) {
      this.bgGfx.fillStyle(0x8800ff, barPulse * 0.05);
      this.bgGfx.fillRect(0, 0, W, H);
    }

    // 레인 그리드
    const lb = [0, 99, 193, 287, 381, W];
    for (let i = 0; i < 5; i++) {
      this.bgGfx.fillStyle(0x330033, i%2===0 ? 0.06 : 0.03);
      this.bgGfx.fillRect(lb[i], 42, lb[i+1]-lb[i], H-74);
    }
    this.bgGfx.lineStyle(1, 0x552255, 0.45 + beatPulse * 0.25);
    for (let i = 1; i < 5; i++) {
      this.bgGfx.beginPath();
      this.bgGfx.moveTo(lb[i], 42);
      this.bgGfx.lineTo(lb[i], H-32);
      this.bgGfx.strokePath();
    }
    // 레인 마커: 비트에 맞춰 펄스
    for (let i = 0; i < 5; i++) {
      const active = i === p.lane;
      const mH = 5 + (active ? beatPulse * 7 : beatPulse * 3);
      this.bgGfx.fillStyle(active ? 0xff8800 : 0x8844bb, active ? 0.85 : (0.28 + beatPulse * 0.35));
      this.bgGfx.fillRect(this.laneXs[i]-4, H-36, 8, mH);
    }

    // 피버 배경 오버레이
    if (this.gs.fever) {
      this.bgGfx.fillStyle(0xffaa00, 0.06);
      this.bgGfx.fillRect(0, 0, W, H);
    }

    // 적
    this.enemyGfx.clear();
    this.enemies.forEach(e => {
      if (!e.alive) return;

      if (e.type === 'bat') {
        // 박쥐: 보라 날개 + 몸통
        this.enemyGfx.fillStyle(0x440066);
        this.enemyGfx.lineStyle(1.5, 0xaa44ff);
        // 왼 날개
        this.enemyGfx.beginPath();
        this.enemyGfx.moveTo(e.x, e.y);
        this.enemyGfx.lineTo(e.x - e.size*1.6, e.y - e.size*0.9);
        this.enemyGfx.lineTo(e.x - e.size*0.4, e.y + e.size*0.35);
        this.enemyGfx.closePath(); this.enemyGfx.fillPath(); this.enemyGfx.strokePath();
        // 오른 날개
        this.enemyGfx.beginPath();
        this.enemyGfx.moveTo(e.x, e.y);
        this.enemyGfx.lineTo(e.x + e.size*1.6, e.y - e.size*0.9);
        this.enemyGfx.lineTo(e.x + e.size*0.4, e.y + e.size*0.35);
        this.enemyGfx.closePath(); this.enemyGfx.fillPath(); this.enemyGfx.strokePath();
        // 몸통
        this.enemyGfx.fillStyle(0x220033);
        this.enemyGfx.fillCircle(e.x, e.y, e.size*0.55);
        // 눈
        this.enemyGfx.fillStyle(0xff3333, 0.9);
        this.enemyGfx.fillCircle(e.x - e.size*0.2, e.y, 3);
        this.enemyGfx.fillCircle(e.x + e.size*0.2, e.y, 3);

      } else if (e.type === 'gbat') {
        // 거대 박쥐
        this.enemyGfx.fillStyle(0x330055);
        this.enemyGfx.lineStyle(2, 0xcc44ff);
        this.enemyGfx.beginPath();
        this.enemyGfx.moveTo(e.x, e.y);
        this.enemyGfx.lineTo(e.x - e.size*1.7, e.y - e.size*0.95);
        this.enemyGfx.lineTo(e.x - e.size*0.5, e.y + e.size*0.4);
        this.enemyGfx.closePath(); this.enemyGfx.fillPath(); this.enemyGfx.strokePath();
        this.enemyGfx.beginPath();
        this.enemyGfx.moveTo(e.x, e.y);
        this.enemyGfx.lineTo(e.x + e.size*1.7, e.y - e.size*0.95);
        this.enemyGfx.lineTo(e.x + e.size*0.5, e.y + e.size*0.4);
        this.enemyGfx.closePath(); this.enemyGfx.fillPath(); this.enemyGfx.strokePath();
        this.enemyGfx.fillStyle(0x1a001a);
        this.enemyGfx.fillCircle(e.x, e.y, e.size*0.65);
        this.enemyGfx.fillStyle(0xff6600, 0.95);
        this.enemyGfx.fillCircle(e.x - e.size*0.25, e.y, 4.5);
        this.enemyGfx.fillCircle(e.x + e.size*0.25, e.y, 4.5);

      } else if (e.type === 'skeleton' || e.type === 'pskeleton') {
        const isPoss = e.type === 'pskeleton';
        // 해골 머리
        this.enemyGfx.fillStyle(isPoss ? 0x226644 : 0x888877);
        this.enemyGfx.fillCircle(e.x, e.y, e.size);
        this.enemyGfx.fillStyle(isPoss ? 0x88ffcc : 0xddddc8);
        this.enemyGfx.lineStyle(2, isPoss ? 0x44ffaa : 0xffffff, 0.9);
        this.enemyGfx.fillCircle(e.x, e.y, e.size*0.82);
        this.enemyGfx.strokeCircle(e.x, e.y, e.size*0.82);
        // 눈 구멍
        this.enemyGfx.fillStyle(0x000011);
        this.enemyGfx.fillCircle(e.x - e.size*0.28, e.y - e.size*0.12, e.size*0.2);
        this.enemyGfx.fillCircle(e.x + e.size*0.28, e.y - e.size*0.12, e.size*0.2);
        // 이빨
        this.enemyGfx.fillStyle(0x000011);
        this.enemyGfx.fillRect(e.x - e.size*0.3, e.y + e.size*0.18, e.size*0.6, e.size*0.2);
        this.enemyGfx.fillStyle(isPoss ? 0x88ffcc : 0xddddc8);
        for (let i = 0; i < 3; i++)
          this.enemyGfx.fillRect(e.x - e.size*0.22 + i*e.size*0.22, e.y + e.size*0.18, e.size*0.12, e.size*0.2);

      } else if (e.type === 'boss') {
        // 보스: 할로윈 호박
        this.enemyGfx.fillStyle(0x772200);
        this.enemyGfx.fillCircle(e.x, e.y, e.size);
        this.enemyGfx.fillStyle(0xff6600);
        this.enemyGfx.lineStyle(4, 0xffaa00);
        this.enemyGfx.fillCircle(e.x, e.y, e.size*0.86);
        this.enemyGfx.strokeCircle(e.x, e.y, e.size*0.86);
        // 꼭지
        this.enemyGfx.fillStyle(0x224400);
        this.enemyGfx.fillRect(e.x - 5, e.y - e.size - 10, 10, 14);
        // 삼각 눈
        this.enemyGfx.fillStyle(0x000011);
        for (let s = -1; s <= 1; s += 2) {
          this.enemyGfx.beginPath();
          this.enemyGfx.moveTo(e.x + s*e.size*0.28, e.y - e.size*0.18);
          this.enemyGfx.lineTo(e.x + s*(e.size*0.28 - e.size*0.18), e.y + e.size*0.1);
          this.enemyGfx.lineTo(e.x + s*(e.size*0.28 + e.size*0.18), e.y + e.size*0.1);
          this.enemyGfx.closePath(); this.enemyGfx.fillPath();
        }
        // 들쭉 입
        this.enemyGfx.lineStyle(3, 0x000011);
        this.enemyGfx.beginPath();
        const mx = e.x, my = e.y + e.size*0.3;
        this.enemyGfx.moveTo(mx - e.size*0.38, my);
        this.enemyGfx.lineTo(mx - e.size*0.2,  my + e.size*0.2);
        this.enemyGfx.lineTo(mx,                my);
        this.enemyGfx.lineTo(mx + e.size*0.2,  my + e.size*0.2);
        this.enemyGfx.lineTo(mx + e.size*0.38, my);
        this.enemyGfx.strokePath();
        // 패턴 1 충전 글로우
        if (e.pattern === 1 && !e.charging) {
          this.enemyGfx.lineStyle(4, 0xff4400, 0.35);
          this.enemyGfx.strokeCircle(e.x, e.y, e.size * 1.3);
        }
      }
    });

    // 아이템
    this.itemGfx.clear();
    this.items.forEach(item => {
      if (item.type === 'bomb') {
        this.itemGfx.fillStyle(0x333333);
        this.itemGfx.fillCircle(item.x, item.y, item.size);
        this.itemGfx.lineStyle(2, 0xffaa00);
        this.itemGfx.strokeCircle(item.x, item.y, item.size);
        this.itemGfx.fillStyle(0xff4400);
        this.itemGfx.fillRect(item.x - 2, item.y - item.size - 5, 4, 7);
      } else if (item.type === 'fever') {
        this.itemGfx.fillStyle(0xffff00);
        this.itemGfx.fillCircle(item.x, item.y, item.size);
        this.itemGfx.lineStyle(2, 0xff8800, 0.9);
        this.itemGfx.strokeCircle(item.x, item.y, item.size);
        this.itemGfx.fillStyle(0xff4400, 0.85);
        this.itemGfx.fillCircle(item.x, item.y, item.size * 0.45);
      }
    });

    // 레이저
    this.laserGfx.clear();
    this.lasers.forEach(l => {
      const a = l.life / l.maxLife;
      const endY = l.toY || 42;
      // 외곽 글로우
      this.laserGfx.lineStyle(10, 0xcc44ff, a * 0.25);
      this.laserGfx.beginPath();
      this.laserGfx.moveTo(l.x, l.fromY);
      this.laserGfx.lineTo(l.x, endY);
      this.laserGfx.strokePath();
      // 중간 빔
      this.laserGfx.lineStyle(4, 0xff88ff, a * 0.7);
      this.laserGfx.beginPath();
      this.laserGfx.moveTo(l.x, l.fromY);
      this.laserGfx.lineTo(l.x, endY);
      this.laserGfx.strokePath();
      // 코어 (흰색)
      this.laserGfx.lineStyle(1.5, 0xffffff, a);
      this.laserGfx.beginPath();
      this.laserGfx.moveTo(l.x, l.fromY);
      this.laserGfx.lineTo(l.x, endY);
      this.laserGfx.strokePath();
    });

    // 적 탄
    this.bulletGfx.clear();
    this.enemyBullets.forEach(b => {
      if (!b.alive) return;
      this.bulletGfx.fillStyle(0xeeddcc);
      this.bulletGfx.fillCircle(b.x, b.y, 5);
      this.bulletGfx.lineStyle(1.5, 0x887766, 0.65);
      this.bulletGfx.strokeCircle(b.x, b.y, 5);
    });

    // 플레이어 유령
    this.playerGfx.clear();
    if (this._playerVisible) {
      const px = p.x, py = p.y;
      this.playerGfx.fillStyle(0xeeeeff, 0.94);
      this.playerGfx.fillCircle(px, py - p.h*0.38, p.w*0.88);
      this.playerGfx.fillRect(px - p.w*0.88, py - p.h*0.38, p.w*1.76, p.h*0.68);
      // 웨이브 하단 3개 반원
      for (let i = 0; i < 3; i++)
        this.playerGfx.fillCircle(px - p.w*0.58 + i*p.w*0.58, py + p.h*0.3, p.w*0.36);
      // 눈
      this.playerGfx.fillStyle(0x000011);
      this.playerGfx.fillCircle(px - p.w*0.3,  py - p.h*0.32, p.w*0.22);
      this.playerGfx.fillCircle(px + p.w*0.3,  py - p.h*0.32, p.w*0.22);
    }

    // 파티클
    this.particleGfx.clear();
    this.particles.forEach(pt => {
      const a = Math.max(0, pt.life / pt.maxLife);
      this.particleGfx.fillStyle(pt.color, a);
      this.particleGfx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
    });
  }
}

// ─── ClearScene ───────────────────────────────────────────────────────────────
class ClearScene extends Phaser.Scene {
  constructor() { super('ClearScene'); }
  create(data) {
    this.cameras.main.fadeIn(600);
    this.add.rectangle(0, 0, W, H, 0x080010).setOrigin(0);
    for (let i = 0; i < 100; i++)
      this.add.circle(Math.random()*W, Math.random()*H, Math.random()*2+0.3, 0xffeeaa, Math.random()*0.6+0.1);
    this.add.text(W/2, H/2 - 165, 'STAGE CLEAR!', {
      fontSize: '44px', fontFamily: 'system-ui', color: '#ffff44', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 6,
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 - 98, '🎃', { fontSize: '62px' }).setOrigin(0.5);
    this.add.text(W/2, H/2 - 15, '최종 점수', {
      fontSize: '20px', fontFamily: 'system-ui', color: '#ffaa66'
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 + 55, (data.score||0).toLocaleString(), {
      fontSize: '54px', fontFamily: 'system-ui', color: '#ffffff', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 4,
    }).setOrigin(0.5);
    const bg = this.add.graphics();
    const d = c => { bg.clear(); bg.fillStyle(c); bg.fillRoundedRect(W/2-100, H/2+125, 200, 50, 10); };
    d(0x882200);
    const z = this.add.zone(W/2, H/2+150, 200, 50).setInteractive();
    this.add.text(W/2, H/2+150, '다시 시작', { fontSize: '22px', fontFamily: 'system-ui', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    z.on('pointerover', () => d(0xcc3300)).on('pointerout', () => d(0x882200));
    z.on('pointerdown', () => { this.cameras.main.fade(300,0,0,0); this.time.delayedCall(300, () => this.scene.start('SongSelectScene')); });
  }
}

// ─── GameOverScene ────────────────────────────────────────────────────────────

  constructor() { super('GameOverScene'); }
  create(data) {
    this.cameras.main.fadeIn(500);
    this.add.rectangle(0, 0, W, H, 0x080010).setOrigin(0);
    for (let i = 0; i < 80; i++)
      this.add.circle(Math.random()*W, Math.random()*H, Math.random()*1.5+0.3, 0xffffff, Math.random()*0.4+0.1);
    this.add.text(W/2, H/2 - 155, 'GAME OVER', {
      fontSize: '50px', fontFamily: 'system-ui', color: '#ff4444', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 6,
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 - 72, '최종 점수', {
      fontSize: '20px', fontFamily: 'system-ui', color: '#ffaa66'
    }).setOrigin(0.5);
    this.add.text(W/2, H/2 + 10, (data.score||0).toLocaleString(), {
      fontSize: '52px', fontFamily: 'system-ui', color: '#ffffff', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 4,
    }).setOrigin(0.5);
    const bg = this.add.graphics();
    const d = c => { bg.clear(); bg.fillStyle(c); bg.fillRoundedRect(W/2-100, H/2+105, 200, 50, 10); };
    d(0x882200);
    const z = this.add.zone(W/2, H/2+130, 200, 50).setInteractive();
    this.add.text(W/2, H/2+130, '다시 시작', { fontSize: '22px', fontFamily: 'system-ui', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    z.on('pointerover', () => d(0xcc3300)).on('pointerout', () => d(0x882200));
    z.on('pointerdown', () => { this.cameras.main.fade(300,0,0,0); this.time.delayedCall(300, () => this.scene.start('SongSelectScene')); });
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  resolution: window.devicePixelRatio || 1,
  render: { antialias: true, roundPixels: false },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, LevelPreloadScene, BgmPreloadScene, TitleScene, SongSelectScene, GameScene, ClearScene, GameOverScene],
  backgroundColor: '#000000',
});
</script>
