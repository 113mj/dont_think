<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Boom Night Level Editor</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
            --accent: #ff8800;
            --lane: #2a2a2a;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        #sidebar {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
        input, select {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.85rem; }
        .checkbox-group input { width: auto; margin: 0; }
        button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        button.secondary { background: #444; }

        /* Main Workspace */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #toolbar {
            height: 60px;
            background: var(--panel);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }
        .tool {
            padding: 5px 12px;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
        }
        .tool.active { background: var(--accent); color: white; }

        /* Timeline */
        #timeline-container {
            flex: 1;
            overflow-y: scroll;
            background: #000;
            position: relative;
            cursor: crosshair;
        }
        #timeline {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px; /* 5 lanes * 80px */
            background: #050505;
            min-height: 100%;
        }
        .lane-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #222;
        }
        .beat-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: #151515;
        }
        .beat-line.bar { background: #444; height: 2px; }
        .beat-label {
            position: absolute;
            left: -35px;
            font-size: 10px;
            color: #666;
            transform: translateY(-50%);
        }
        
        .enemy-node {
            position: absolute;
            width: 60px;
            height: 30px;
            background: var(--accent);
            border-radius: 4px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: black;
            box-shadow: 0 0 10px rgba(255,136,0,0.5);
        }
        .enemy-node.gbat { background: #cc44ff; color: white; }
        .enemy-node.skeleton { background: #fff; color: black; }
        .enemy-node.pskeleton { background: #44ffaa; color: black; }
        .enemy-node.boss { background: #ff4400; color: white; width: 80px; height: 40px; }
        .enemy-node.item { background: #ffff44; color: black; border-radius: 50%; width: 30px; }

        /* Audio Controls */
        #audio-controls {
            height: 80px;
            background: var(--panel);
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }
        #progress-bar {
            flex: 1;
            height: 6px;
            background: #333;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            width: 0%;
        }
        #time-display { font-family: monospace; min-width: 120px; }

        #playback-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: red;
            z-index: 10;
            box-shadow: 0 0 8px red;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Level Config</h2>
    <div class="section">
        <button id="btn-open-folder">📁 Open Level Folder</button>
    </div>

    <div id="edit-pane" style="display: none;">
        <div class="section">
            <label>Level Name</label>
            <input type="text" id="cfg-name">
            <label>BPM</label>
            <input type="number" id="cfg-bpm" value="130">
            <label>Offset (sec)</label>
            <input type="number" id="cfg-offset" step="0.01" value="0.51">
            <label>Difficulty</label>
            <input type="text" id="cfg-diff" value="★★★">
        </div>

        <h2>Editor Settings</h2>
        <div class="section">
            <div class="checkbox-group">
                <input type="checkbox" id="snap-enabled" checked>
                <label for="snap-enabled" style="margin:0;">Snap to Beat</label>
            </div>
            <label>Snap Division</label>
            <select id="snap-division">
                <option value="1">1/1 (Full Beat)</option>
                <option value="2">1/2 (8th Note)</option>
                <option value="4">1/4 (16th Note)</option>
            </select>
        </div>

        <h2>Enemy Stats</h2>
        <div class="section">
            <label>Enemy Type</label>
            <select id="stat-type">
                <option value="bat">Bat (Normal)</option>
                <option value="gbat">Giant Bat</option>
                <option value="skeleton">Skeleton</option>
                <option value="pskeleton">Possessed Skeleton</option>
            </select>
            <label>Move Speed</label>
            <input type="number" id="stat-speed">
            <label>HP</label>
            <input type="number" id="stat-hp">
        </div>

        <button id="btn-save">💾 Save level.json</button>
    </div>
</div>

<div id="main">
    <div id="toolbar">
        <div class="tool active" data-type="bat">Bat</div>
        <div class="tool" data-type="gbat">G-Bat</div>
        <div class="tool" data-type="skeleton">Skel</div>
        <div class="tool" data-type="pskeleton">P-Skel</div>
        <div class="tool" data-type="item_bomb">Bomb</div>
        <div class="tool" data-type="item_fever">Fever</div>
        <div class="tool" data-type="boss">BOSS</div>
        <div style="flex:1"></div>
        <span style="font-size: 0.8rem; color: #888;">L-Click: Place | R-Click: Delete</span>
    </div>

    <div id="timeline-container">
        <div id="timeline">
            <div id="playback-line"></div>
        </div>
    </div>

    <div id="audio-controls">
        <button id="btn-play" style="width: 80px;">Play</button>
        <div id="time-display">00:00 / 00:00</div>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div style="font-size: 0.8rem;">Zoom: </div>
        <input type="range" id="zoom-range" min="10" max="100" value="40" style="width: 100px; margin:0;">
    </div>
</div>

<audio id="audio-player"></audio>
<input type="file" id="folder-input" webkitdirectory style="display: none;">

<script>
    const PX_PER_BEAT = 100; // Base spacing: 100px per Beat
    let zoom = 0.4;
    let levelData = null;
    let selectedType = 'bat';

    const timeline = document.getElementById('timeline');
    const container = document.getElementById('timeline-container');
    const player = document.getElementById('audio-player');
    const playbackLine = document.getElementById('playback-line');

    // UI Tools
    document.querySelectorAll('.tool').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            selectedType = t.dataset.type;
        };
    });

    document.getElementById('btn-open-folder').onclick = () => document.getElementById('folder-input').click();

    document.getElementById('folder-input').onchange = async (e) => {
        const files = e.target.files;
        let jsonFile = null;
        let audioFile = null;

        for (const file of files) {
            if (file.name === 'level.json') jsonFile = file;
            if (file.name === 'bgm.mp3') audioFile = file;
        }

        if (jsonFile) {
            const text = await jsonFile.text();
            levelData = JSON.parse(text);
            
            // Migration: Convert time to beat if necessary
            if (levelData.waves.length > 0 && levelData.waves[0].time !== undefined) {
                const bpm = levelData.config.bpm || 130;
                const offset = levelData.config.offset || 0;
                levelData.waves.forEach(w => {
                    w.beat = parseFloat(((w.time - offset) / (60 / bpm)).toFixed(3));
                    delete w.time;
                });
            }
            initEditor();
        }
        if (audioFile) {
            player.src = URL.createObjectURL(audioFile);
        }
        document.getElementById('edit-pane').style.display = 'block';
    };

    function initEditor() {
        document.getElementById('cfg-name').value = levelData.config.name;
        document.getElementById('cfg-bpm').value = levelData.config.bpm;
        document.getElementById('cfg-offset').value = levelData.config.offset;
        document.getElementById('cfg-diff').value = levelData.config.difficulty;
        updateStatPane();
        renderTimeline();
    }

    document.getElementById('cfg-bpm').onchange = renderTimeline;
    document.getElementById('cfg-offset').onchange = renderTimeline;

    document.getElementById('stat-type').onchange = updateStatPane;
    function updateStatPane() {
        const type = document.getElementById('stat-type').value;
        const s = levelData.enemyStats[type];
        if (s) {
            document.getElementById('stat-speed').value = s.speed;
            document.getElementById('stat-hp').value = s.hp;
        }
    }

    function renderTimeline() {
        timeline.querySelectorAll('.enemy-node, .beat-line, .lane-line, .beat-label').forEach(n => n.remove());

        const bpm = parseFloat(document.getElementById('cfg-bpm').value) || 120;
        const duration = player.duration || 300;
        const totalBeats = (duration * bpm) / 60;
        
        const totalHeight = totalBeats * PX_PER_BEAT * zoom;
        timeline.style.height = totalHeight + 'px';

        // Draw Lanes
        for (let i = 0; i <= 5; i++) {
            const l = document.createElement('div');
            l.className = 'lane-line';
            l.style.left = (i * 80) + 'px';
            timeline.appendChild(l);
        }

        // Draw Beats
        for (let b = 0; b < totalBeats; b += 0.25) {
            if (b % 1 !== 0 && b % 0.5 !== 0) continue; // Only draw up to 1/2 beat for grid
            const line = document.createElement('div');
            line.className = 'beat-line';
            if (b % 4 === 0) line.classList.add('bar');
            line.style.top = (b * PX_PER_BEAT * zoom) + 'px';
            timeline.appendChild(line);

            if (b % 1 === 0) {
                const label = document.createElement('div');
                label.className = 'beat-label';
                label.innerText = b;
                label.style.top = (b * PX_PER_BEAT * zoom) + 'px';
                timeline.appendChild(label);
            }
        }

        // Draw Enemies
        levelData.waves.forEach((w, idx) => createNode(w, idx));
    }

    function createNode(w, idx) {
        const node = document.createElement('div');
        node.className = `enemy-node ${w.type.includes('item') ? 'item' : w.type}`;
        node.innerText = w.type === 'boss' ? 'BOSS' : (w.type.includes('item') ? '★' : w.type[0].toUpperCase());
        node.style.top = (w.beat * PX_PER_BEAT * zoom) + 'px';
        const lane = w.lane < 0 ? 2 : w.lane;
        node.style.left = (lane * 80 + 40) + 'px';
        node.title = `Beat: ${w.beat}`;

        node.oncontextmenu = (e) => {
            e.preventDefault();
            levelData.waves.splice(idx, 1);
            renderTimeline();
        };
        timeline.appendChild(node);
    }

    timeline.onclick = (e) => {
        if (e.target !== timeline) return;
        const rect = timeline.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const x = e.clientX - rect.left;
        
        let beat = y / (PX_PER_BEAT * zoom);
        if (document.getElementById('snap-enabled').checked) {
            const div = parseInt(document.getElementById('snap-division').value);
            beat = Math.round(beat * div) / div;
        }

        const lane = Math.floor(x / 80);
        levelData.waves.push({ beat: parseFloat(beat.toFixed(3)), type: selectedType, lane: lane });
        levelData.waves.sort((a,b) => a.beat - b.beat);
        renderTimeline();
    };

    document.getElementById('btn-play').onclick = () => {
        if (player.paused) { player.play(); document.getElementById('btn-play').innerText = 'Pause'; }
        else { player.pause(); document.getElementById('btn-play').innerText = 'Play'; }
    };

    player.ontimeupdate = () => {
        const cur = player.currentTime;
        const total = player.duration || 1;
        document.getElementById('time-display').innerText = formatTime(cur) + ' / ' + formatTime(total);
        document.getElementById('progress-fill').style.width = (cur / total * 100) + '%';
        
        const bpm = parseFloat(document.getElementById('cfg-bpm').value) || 120;
        const offset = parseFloat(document.getElementById('cfg-offset').value) || 0;
        const currentBeat = (cur - offset) * (bpm / 60);
        
        const y = currentBeat * PX_PER_BEAT * zoom;
        playbackLine.style.top = y + 'px';
        
        if (!player.paused) {
            const containerRect = container.getBoundingClientRect();
            if (y > container.scrollTop + containerRect.height - 150 || y < container.scrollTop) {
                container.scrollTop = y - 150;
            }
        }
    };

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m.toString().padStart(2,'0') + ':' + sec.toString().padStart(2,'0');
    }

    document.getElementById('zoom-range').oninput = (e) => {
        zoom = e.target.value / 100;
        renderTimeline();
    };

    document.getElementById('btn-save').onclick = () => {
        levelData.config.name = document.getElementById('cfg-name').value;
        levelData.config.bpm = parseFloat(document.getElementById('cfg-bpm').value);
        levelData.config.offset = parseFloat(document.getElementById('cfg-offset').value);
        levelData.config.difficulty = document.getElementById('cfg-diff').value;

        const type = document.getElementById('stat-type').value;
        levelData.enemyStats[type].speed = parseInt(document.getElementById('stat-speed').value);
        levelData.enemyStats[type].hp = parseInt(document.getElementById('stat-hp').value);

        const blob = new Blob([JSON.stringify(levelData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'level.json';
        a.click();
    };
</script>
</body>
</html>
